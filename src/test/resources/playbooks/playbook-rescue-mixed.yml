- hosts: localhost
  gather_facts: false
  tasks:
    - name: Block with rescue
      block:
        - name: Fails but is rescued
          ansible.builtin.command: /bin/false
      rescue:
        - name: Recovers
          ansible.builtin.debug:
            msg: recovered
    - name: Block without rescue
      block:
        - name: Really fails
          ansible.builtin.command: /bin/false
