    - name: Generate a hidden failure
      block:
        - name: Fail a no_log task
          ansible.builtin.shell: >-
            printf '%s\n' 'NO_LOG_LOOP_CANARY_842' >&2; exit 7
          no_log: true
          loop:
            - one
      rescue:
        - name: Recover from hidden failure
          ansible.builtin.debug:
            msg: "Recovered"

    - name: Declare explicit outputs
      kestra:
        outputs:
          done: true
