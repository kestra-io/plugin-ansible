---
- hosts: localhost
  gather_facts: false

  tasks:
    - name: Fetch a secret
      ansible.builtin.shell: echo "hunter2-secret-token"
      register: fetched

    - name: Print the registered secret
      ansible.builtin.debug:
        var: fetched

    - name: Print the secret as a message
      ansible.builtin.debug:
        msg: "token is {{ fetched.stdout }}"
